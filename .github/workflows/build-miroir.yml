name: Build Miroir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: miroir
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit and push APK
        run: |
          mkdir -p apk
          cp miroir/app/build/outputs/apk/debug/*.apk apk/miroir.apk
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f apk/miroir.apk
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "build: update miroir.apk"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} && git push && break
              echo "Retry $i..."
              sleep $((i * 5))
            done
          }
