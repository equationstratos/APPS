name: Build Niveau APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: niveau
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: niveau-debug-apk
          path: niveau/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Get version
        id: version
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp niveau/app/build/outputs/apk/debug/*.apk niveau-debug.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: niveau-latest
          name: "Niveau - Latest Build"
          body: "Auto-built APK for Niveau. Download and install on Android."
          files: niveau-debug.apk
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
