name: Build Loupe APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: loupe
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy APK to repo
        run: |
          mkdir -p apk
          cp loupe/app/build/outputs/apk/debug/*.apk apk/loupe.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apk/loupe.apk
          git diff --cached --quiet && echo "No changes" || (git commit -m "build: update loupe.apk" && git push)
