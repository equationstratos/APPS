name: Build All APKs

on:
  push:
    paths-ignore:
      - 'apk/**'
      - '**/*.md'
      - 'ruview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [boussole, niveau, convertisseur, lampe, chronometre, regle, sonometre, loupe, miroir, calculatrice, imc, compteur, fuseaux, metronome, batterie, rapporteur, podometre, lux, accelerometre, thermometre, vibrometre, metal, vitesse, reseau, pouls, soleil, signaux, accordeur, morse, sifflet, altimetre, checklist, carnet, stocks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  commit-apks:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: downloaded-apks

      - name: Copy APKs to apk folder
        run: |
          shopt -s nullglob
          mkdir -p apk
          for dir in downloaded-apks/*-apk; do
            app=$(basename "$dir" | sed 's/-apk$//')
            for f in "$dir"/*.apk; do cp "$f" "apk/${app}.apk"; done
          done
          ls -lh apk/

      - name: Commit and push APKs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f apk/*.apk
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "build: update APKs"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} && git push && break
              echo "Retry $i..."
              sleep $((i * 5))
            done
          }
