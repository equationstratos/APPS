name: Build APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: convertisseur

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/.android
          echo "### User Sources for Android SDK Manager" > $HOME/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" 2>&1 | grep -v "Warning"

      - name: Build Debug APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          ./gradlew assembleDebug -x lint --stacktrace

      - name: Build Release APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          ./gradlew assembleRelease -x lint --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convertisseur-debug
          path: convertisseur/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convertisseur-release
          path: convertisseur/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
