name: Build Boussole APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temuim'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: boussole
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK files
        run: find boussole/app/build -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boussole-debug-apk
          path: boussole/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
